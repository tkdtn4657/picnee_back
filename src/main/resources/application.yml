spring:
  profiles:
    active: ${SPRING_PROFILES_INCLUDE:local}
    include : secret
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  data:
    redis:
      host: localhost
      port: 6379
logging:
  level:
    org:
      springframework:
        web: DEBUG
        web.filter.CommonsRequestLoggingFilter: DEBUG
google:
  place:
    base-url: https://maps.googleapis.com/maps/api/place/details/json
    api-key: ${GOOGLE_PLACE_API_KEY:}
    language: ko
    refresh-after-days: 30
    cache-ttl-days: 5
